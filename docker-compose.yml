version: '3.8'
services:
  evez-orchestrator:
    image: node:22-alpine
    container_name: evez-orchestrator
    working_dir: /opt/evez666/repos/evez-agentnet
    volumes:
      - ./evez-agentnet:/opt/evez666/repos/evez-agentnet
      - ./forge_output:/opt/evez666/forge_output
      - ./evez-autonomous-ledger:/opt/evez666/repos/evez-autonomous-ledger
      - ./evez-meme-bus:/opt/evez666/repos/evez-meme-bus
      - ./evez-os:/opt/evez666/repos/evez-os
      - ./evez-landing:/opt/evez666/repos/evez-landing
      - ./evez666-arg-canon:/opt/evez666/repos/evez666-arg-canon
    environment:
      - NODE_ENV=production
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENCLAW_GATEWAY=https://136.118.144.227
      - OPENCLAW_TOKEN=${OPENCLAW_TOKEN:-m5NoJmN1qHr3NiUHAbz83CskdsGPUPJn}
      - TELEGRAM_BOT_TOKEN=8940286601:AAGRc2XG3X6sCXZTWrnpxteb8Wy-qAhHtjM
      - TELEGRAM_CHAT_ID=7453631330
      - TZ=UTC
    restart: unless-stopped
    command: >
      sh -c "npm install --production 2>/dev/null; python3 orchestrator.py"
    ports:
      - "18789:18789"
      - "80:80"
    tty: true
    stdin_open: true
