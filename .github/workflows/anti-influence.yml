name: anti-influence

on:
  push:
    branches:
      - phenomenon-engine-v0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anti-influence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Run anti-influence regressions
        run: >
          python -m pytest -q
          tests/test_anti_influence.py
          tests/test_anti_influence_control.py
