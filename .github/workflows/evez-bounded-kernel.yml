name: evez-bounded-kernel

on:
  push:
    branches: ["**"]
  pull_request:


permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  compile:
    name: compile-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - name: Compile bounded kernel
        run: |
          python -m py_compile             research/precision_contract.py             research/lexile_semantics.py             research/intent_optimizer.py             research/outcome_engine.py             research/execution_kernel.py             research/reality_substrate.py             research/artifact_contracts.py             legal/license_opportunity.py             mobile/evez_precision.py             mobile/evez_lexile.py             mobile/evez_intent.py             mobile/evez_reality.py
          bash -n mobile/evezctl

  unit:
    name: test-${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - research/test_precision_contract.py
          - research/test_lexile_semantics.py
          - research/test_intent_optimizer.py
          - research/test_outcome_engine.py
          - research/test_execution_kernel.py
          - research/test_reality_substrate.py
          - research/test_artifact_contracts.py
          - legal/test_license_opportunity.py
          - mobile/test_evez_precision.py
          - mobile/test_evez_lexile.py
          - mobile/test_evez_intent.py
          - mobile/test_evez_reality.py
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - name: Run isolated contract
        run: python ${{ matrix.test }}

  strict-failure:
    name: strict-failure-semantics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - name: Verify vague intent stays blocked
        run: |
          set +e
          python mobile/evez_precision.py --intent "do everything fully"
          precision_status=$?
          python mobile/evez_intent.py --intent "do everything fully"
          intent_status=$?
          set -e
          test "$precision_status" -eq 2
          test "$intent_status" -eq 2

  command-surface:
    name: mobile-command-surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python mobile/evez_precision.py --help
          python mobile/evez_lexile.py --help
          python mobile/evez_intent.py --help
          python mobile/evez_reality.py --help

  rights-source:
    name: rights-source-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - name: Verify license audit contract
        run: |
          test -s LICENSE
          python legal/license_opportunity.py . > /tmp/evez-rights.json
          python - <<'PY'
          import json
          payload = json.load(open("/tmp/evez-rights.json", encoding="utf-8"))
          assert payload["schema"] == "evez-license-opportunity-v1"
          assert len(payload["audit_sha256"]) == 64
          assert payload["summary"]["assets"] > 0
          print("rights audit: PASS")
          PY
