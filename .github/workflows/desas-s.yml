name: DESA-S Opaque-Domain Benchmark

on:
  push:
    paths:
      - "evez_adaptive_socratious.py"
      - "tests/test_socratious.py"
      - "benchmarks/desas-socratious/**"
      - "schemas/desas-*.json"
      - ".github/workflows/desas-s.yml"
  pull_request:
    paths:
      - "evez_adaptive_socratious.py"
      - "tests/test_socratious.py"
      - "benchmarks/desas-socratious/**"
      - "schemas/desas-*.json"
      - ".github/workflows/desas-s.yml"

jobs:
  desas-s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile reference runtime
        run: python -m py_compile evez_adaptive_socratious.py
      - name: Run unit tests
        run: |
          python -m pip install pytest
          PYTHONPATH=. pytest -q tests/test_socratious.py
      - name: Run opaque-domain benchmark
        run: |
          PYTHONPATH=. python3 benchmarks/desas-socratious/self_test.py
          PYTHONPATH=. python3 benchmarks/desas-socratious/verify_evex.py
      - name: Verify EVEZ example
        run: python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path("examples/desas-socratious.evez")
          doc = json.loads(path.read_text(encoding="utf-8"))
          check = json.loads(path.read_text(encoding="utf-8"))
          check["integrity"].pop("sha256", None)
          canonical = json.dumps(check, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == doc["integrity"]["sha256"]
          assert doc["evez"] == "EVEZ" and doc["state"] == "PROPOSED"
          print("PASS DESA-S EVEZ state fixture v1")
        PY
