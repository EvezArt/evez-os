name: bounded-evolution-receipt

on:
  push:
    branches:
      - "evolution/receipt-boundary-001"
    paths:
      - "mobile/evolution_receipt.py"
      - "mobile/test_evolution_receipt.py"
      - ".github/workflows/bounded-evolution-receipt.yml"
  pull_request:
    paths:
      - "mobile/evolution_receipt.py"
      - "mobile/test_evolution_receipt.py"
      - "mobile/evezctl"
      - ".github/workflows/bounded-evolution-receipt.yml"

permissions:
  contents: read

jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile receipt runtime
        run: python -m py_compile mobile/evolution_receipt.py
      - name: Run adversarial receipt tests
        run: python mobile/test_evolution_receipt.py
      - name: Verify mobile CLI syntax
        run: bash -n mobile/evezctl
      - name: Verify receipt provenance gate
        run: |
          tmp="$RUNNER_TEMP/evez-receipt"
          mkdir -p "$tmp/repo"
          git -C "$tmp/repo" init
          git -C "$tmp/repo" config user.email "ci@example.invalid"
          git -C "$tmp/repo" config user.name "evez-ci"
          printf 'fixture\\n' > "$tmp/repo/fixture.txt"
          git -C "$tmp/repo" add fixture.txt
          git -C "$tmp/repo" commit -m fixture
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("$tmp/spec.json")
          p.write_text(json.dumps({
              "schema_version": 1,
              "source_commit": "0" * 40,
              "working_tree_state": {"clean": True, "files": [{"path": "fixture.txt", "sha256": "0" * 64}]},
              "test_manifest": [{"id": "fixture", "command": ["python", "-c", "print('pass')"], "expected_exit_code": 0}],
              "test_results": [{"id": "fixture", "exit_code": 0, "stdout_sha256": "0" * 64, "stderr_sha256": "0" * 64, "status": "PASS"}],
              "evidence_input_digests": {"fixture": "0" * 64},
              "proposal_digest": "0" * 64,
              "contradiction_cases": [{"id": "c", "claim": "bind", "falsifier": "tamper", "resolution": "reject", "resolved": True}],
              "failed_attempts": ["self-declared provenance"],
              "uncertainties": ["external runner not implied"],
              "dissenting_observations": ["integrity is not truth"],
              "verification_status": "PROPOSED",
              "verification_timestamp": "2026-10-07T00:00:00Z"
          }, sort_keys=True))
          PY
          python mobile/evolution_receipt.py capture "$tmp/repo" "$tmp/spec.json" "$tmp/captured.json"
          python mobile/evolution_receipt.py build "$tmp/captured.json" "$tmp/receipt.json"
          python mobile/evolution_receipt.py verify-against "$tmp/receipt.json" "$tmp/repo"
