name: Crystalinformergence Validation

on:
  pull_request:
    paths:
      - "src/cognition/carnation.py"
      - "schema/carnation_tag_v1.schema.json"
      - "docs/CRYSTALINFORMERGENCE.md"
      - "docs/LLM_WITNESS_PROTOCOL.md"
      - "tests/test_carnation.py"
      - ".github/workflows/carnation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-carnation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile module
        run: python -m py_compile src/cognition/carnation.py

      - name: Validate JSON schema
        run: python -m json.tool schema/carnation_tag_v1.schema.json >/dev/null

      - name: Run focused tests
        run: PYTHONPATH=. python -m unittest -v tests.test_carnation
