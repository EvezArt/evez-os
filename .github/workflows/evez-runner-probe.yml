name: evez-runner-probe

on:
  push:
    branches: ["evez-reality-substrate/2026-10"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect runner
        run: |
          set -eux
          uname -a
          python --version
          git --version
          pwd
          git ls-remote https://github.com/EvezArt/evez-os.git HEAD
      - name: Clone without checkout action
        run: |
          set -eux
          git clone --depth 1 https://github.com/EvezArt/evez-os.git /tmp/evez-probe
          cd /tmp/evez-probe
          PYTHONPATH=. python research/test_precision_contract.py
          PYTHONPATH=. python research/test_reality_substrate.py
