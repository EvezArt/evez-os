name: mobile-first-smoke

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  shell-and-mobile-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate mobile scripts
        run: |
          bash -n mobile/evezctl
          bash -n mobile/install.sh
          test -s mobile/evezctl
          python mobile/test_mobile.py
          python -m py_compile mobile/evez_value_architect.py mobile/evez_architect.py mobile/evez_toroid.py mobile/evez_unlock.py
          python -m unittest -v tests/test_value_architect.py
          test -s mobile/install.sh
          test -s mobile/README.md
          test -s docs/MOBILE_FIRST.md

      - name: Exercise offline-safe CLI
        run: |
          chmod +x mobile/evezctl
          HOME="$RUNNER_TEMP/evez-home" EVEZ_ENDPOINT="https://example.invalid" EVEZ_CONFIG="$RUNNER_TEMP/evez-home/.config/evez/evez.env" mobile/evezctl doctor
