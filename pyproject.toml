[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evez-format"
version = "0.1.0"
description = "Reference reader, writer, verifier, and CLI for the EVEZ file format"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
evez = "evez_file:cli"
evez-socratious = "evez_adaptive_socratious:cli"
