[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evez-evidence-runtime"
version = "0.5.0"
description = "Bounded adversarial evidence runtime with immutable witness receipts and deterministic epistemic optimization"
requires-python = ">=3.10"
authors = [{name = "Steven Crawford-Maggard"}]
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
evez-evidence = "evez_evidence_runtime.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
